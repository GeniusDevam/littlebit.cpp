[build-system]
requires = ["setuptools>=77", "wheel", "torch>=2.10,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "littlebit"
version = "0.1.0"
description = "Packed LittleBit inference on CPU"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.10,<3", "transformers~=5.5.0", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
littlebit-info = "littlebit.cli:info"
littlebit-bench = "littlebit.bench:main"

[tool.setuptools.packages.find]
include = ["littlebit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads or uses full model checkpoints"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
